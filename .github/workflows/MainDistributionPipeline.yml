#
# Primary binary distribution pipeline.
# The current DuckDB line is built here against v1.5.5.
# Minimum-version compatibility for v1.5.0 is validated in CI and packaged in release.yml.
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-primary-build:
    name: Build extension binaries (DuckDB v1.5.5 primary line)
    # extension-ci-tools v1.5-variegata; keep the workflow and input pinned together.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@72e76e99cd7fee45a99739cd118ec2db64e034ec
    with:
      duckdb_version: v1.5.5
      ci_tools_version: 72e76e99cd7fee45a99739cd118ec2db64e034ec
      extension_name: dplyr
      extra_toolchains: rust

  duckdb-v2-build:
    name: Build extension binaries (DuckDB v2.0.0)
    # extension-ci-tools v2.0-cyanoptera; keep the workflow and input pinned together.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@78bd1e4abbd543822166d5b07644751ba1fc6e8d
    with:
      duckdb_version: v2.0.0
      duckdb_commit: d54cbbe3df17e8e5ce68312f483b4155836112aa
      ci_tools_version: 78bd1e4abbd543822166d5b07644751ba1fc6e8d
      extension_name: dplyr
      extra_toolchains: rust
